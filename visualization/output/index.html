<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coherent Dictionary — Structure Explorer</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: auto 1fr;
    }
    header {
      grid-column: 1 / -1;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 1rem;
      margin: 0;
      font-weight: 600;
    }
    header .meta {
      color: var(--muted);
      font-size: 0.85rem;
    }
    aside {
      border-right: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    main {
      position: relative;
      overflow: hidden;
    }
    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    input[type="search"], select {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
    }
    .legend, .chain-list {
      font-size: 0.82rem;
    }
    .legend-item, .chain-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      cursor: pointer;
      padding: 0.25rem 0;
    }
    .legend-item:hover, .chain-item:hover { color: var(--accent); }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .detail {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    .detail h2 {
      font-size: 1.05rem;
      margin: 0 0 0.5rem;
    }
    .detail .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }
    .tag {
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .detail p {
      font-size: 0.88rem;
      line-height: 1.55;
      color: #c9d1d9;
      margin: 0;
    }
    .detail .refs {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .ref-link {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }
    #graph {
      width: 100%;
      height: 100%;
    }
    .node circle { cursor: pointer; stroke: #0d1117; stroke-width: 1.5px; }
    .node text {
      font-size: 10px;
      fill: var(--text);
      pointer-events: none;
      text-shadow: 0 0 3px #0d1117, 0 0 3px #0d1117;
    }
    .link { stroke: #484f58; stroke-opacity: 0.45; }
    .link.spine { stroke: #58a6ff; stroke-opacity: 0.7; stroke-width: 2px; }
    .link.highlight { stroke: #f0883e; stroke-opacity: 1; stroke-width: 2px; }
    .node.highlight circle { stroke: #f0883e; stroke-width: 3px; }
    .node.dimmed { opacity: 0.15; }
    .toolbar {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      display: flex;
      gap: 0.5rem;
    }
    button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .empty { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Coherent Dictionary — Structure Explorer</h1>
    <span class="meta" id="stats"></span>
  </header>

  <aside>
    <div>
      <label for="search">Search terms</label>
      <input type="search" id="search" placeholder="Consent, Justice, Theft…" />
    </div>
    <div>
      <label for="cluster">Cluster</label>
      <select id="cluster"><option value="">All clusters</option></select>
    </div>
    <div>
      <label for="stability">Stability</label>
      <select id="stability">
        <option value="">All</option>
        <option value="green">Green — tight closure</option>
        <option value="yellow">Yellow — edge pressure</option>
        <option value="blue">Blue — post-hoc addition</option>
        <option value="gray">Gray — implementation</option>
      </select>
    </div>
    <div>
      <label>View mode</label>
      <select id="colorMode">
        <option value="stability">Color by stability</option>
        <option value="cluster">Color by cluster</option>
        <option value="layer">Color by layer</option>
      </select>
    </div>
    <div class="legend" id="legend"></div>
    <div>
      <label>Reasoning chains (derived)</label>
      <div class="chain-list" id="chains"></div>
    </div>
    <div class="detail" id="detail">
      <p class="empty">Click a node to see its definition and references.</p>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <button id="reset">Reset view</button>
      <button id="fit">Fit graph</button>
    </div>
    <svg id="graph"></svg>
  </main>

  <script>
    const GRAPH_DATA = {"meta": {"termCount": 187, "edgeCount": 119, "source": "dictionary/coherent-dictionary-of-simple-english.txt"}, "clusters": {"axioms": ["Law", "Golden Rule (Passive Version)", "Logic", "Belief", "Truth", "Error", "Reason"], "mind_agency": ["Agent", "Agency", "Action", "Consciousness", "Self-Awareness", "Mind", "Free Will", "Intention", "Decision", "Choice", "Intelligence"], "boundaries_rights": ["Boundary", "Consent", "Agreement", "Permission", "Rights", "Self-Ownership", "Autonomy", "Liberty", "Freedom", "Ownership", "Property"], "harm_crime": ["Harm", "Damage", "Victim", "Crime", "Evil", "Good", "Violation", "Negligence", "Victimless", "Victimless Trade"], "coercion_trade": ["Coercion", "Theft", "Fraud", "Deception", "Duress", "Force", "Violence", "Threat", "Government", "Regulation"], "justice": ["Justice", "Guilt", "Punishment", "Punisher", "Proportion", "Retribution", "Restitution", "Forgiveness", "Revenge", "Self-Defense", "Murder", "Outlaw", "Mandate"], "exchange": ["Trade", "Free Trade", "Deal", "Contract", "Contract Breach", "License", "Market", "Capitalism", "Socialism", "Money", "Currency", "Profit", "IOU", "Debt"], "civilization": ["Civilization", "Civilizational Velocity", "Good News", "Perimeter", "Singleton", "Way of Happiness", "Happiness", "Voluntaryism", "Nomocracy", "War"], "epistemology": ["Knowledge", "Model", "Prediction", "Evidence", "Learning", "Fallibility", "Wisdom", "Curiosity"], "emergence": ["Infinite Change", "Emergence", "Pattern", "Time", "Universe", "Timeless Infinity"]}, "layers": {"Logic": 0, "Law": 0, "Golden Rule (Passive Version)": 0, "Truth": 0, "Agent": 1, "Agency": 1, "Harm": 1, "Boundary": 1, "Consent": 1, "Coercion": 2, "Fraud": 2, "Theft": 2, "Violation": 2, "Victim": 3, "Crime": 3, "Guilt": 3, "Justice": 4, "Self-Defense": 4, "Restitution": 4, "Retribution": 4, "Forgiveness": 4, "Punishment": 4, "Trade": 5, "Market": 5, "Civilization": 5, "Perimeter": 5, "Good News": 5}, "stabilityLegend": {"green": "Tight closure", "yellow": "Thin / edge-case pressure", "blue": "Post-hoc addition", "gray": "Implementation / strategic", "default": "Standard definition"}, "reasoningChains": [{"id": "taxation", "conclusion": "Taxation is theft", "premises": ["Theft", "Democracy", "Government"], "derived": true}, {"id": "voluntary-slavery", "conclusion": "Voluntary slavery is impossible", "premises": ["Self-Ownership", "Consent", "Property"], "derived": true}, {"id": "price-gouging", "conclusion": "Disaster price gouging is coercion", "premises": ["Consent", "Duress", "Coercion"], "derived": true}, {"id": "murder-outlaw", "conclusion": "Murder creates permanent outlaw status", "premises": ["Murder", "Justice", "Outlaw"], "derived": true}, {"id": "ip-vs-license", "conclusion": "IP monopoly is coercion; voluntary license is contract", "premises": ["Intellectual Property", "License", "Contract", "Coercion"], "derived": true}], "nodes": [{"id": 0, "name": "Action", "cluster": "mind_agency", "layer": -1, "stability": "default", "definition": "A change in the environment caused by an agent.", "color": "#c9d1d9", "clusterColor": "#d19a66", "inDegree": 0}, {"id": 1, "name": "Agency", "cluster": "mind_agency", "layer": 1, "stability": "default", "definition": "The capacity to initiate actions.", "color": "#c9d1d9", "clusterColor": "#d19a66", "inDegree": 0}, {"id": 2, "name": "Agent", "cluster": "mind_agency", "layer": 1, "stability": "default", "definition": "Something that can form intentions, make decisions, and initiate actions.", "color": "#c9d1d9", "clusterColor": "#d19a66", "inDegree": 0}, {"id": 3, "name": "Agreement", "cluster": "boundaries_rights", "layer": -1, "stability": "default", "definition": "A clear, voluntary meeting of minds where all sides understand and accept the terms for a proposed interaction that affects boundaries. Without agreement or permission, an action that crosses another's boundary defaults to violation and harm.", "color": "#c9d1d9", "clusterColor": "#98c379", "inDegree": 0}, {"id": 4, "name": "Art", "cluster": "other", "layer": -1, "stability": "default", "definition": "A created pattern intended to express, explore, or communicate something to others. It does not require beauty, approval, or agreement; its defining feature is the maker's intention to share a perception, feeling, idea, or experience. The meaning of art is not contained in the object alone but arises in the interaction between the pattern and the observer. Different observers may experience different responses, and none can be imposed as the 'correct' one. Art thrives through voluntary attention, honest expression, and the freedom to interpret without coercion.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 5, "name": "Attention", "cluster": "other", "layer": -1, "stability": "default", "definition": "The focusing of awareness on a particular thing while ignoring others. Attention selects what the mind processes most strongly at a given moment.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 6, "name": "Authority", "cluster": "other", "layer": -1, "stability": "default", "definition": "An agent or group claiming the right to tell others what to do or take what they own. Authority is just power asserted and has no moral force unless it comes from everyone's voluntary agreement.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 7, "name": "Autonomy", "cluster": "boundaries_rights", "layer": -1, "stability": "default", "definition": "The ability to form intentions and make decisions without external control.", "color": "#c9d1d9", "clusterColor": "#98c379", "inDegree": 0}, {"id": 8, "name": "Awareness", "cluster": "other", "layer": -1, "stability": "default", "definition": "The recognition or detection of something by the mind -- internal (thinking, feeling) or external (objects, events). Awareness is being attentive to something that the mind can represent.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 9, "name": "Beauty", "cluster": "other", "layer": -1, "stability": "default", "definition": "The experience of harmony between an agent's perception and the patterns they encounter. It arises when something fits together in a way the observer finds pleasing, meaningful, or balanced. Beauty is not a property of the object itself but a response within the observer, shaped by their senses, memories, and values. Because beauty is a subjective experience, it cannot be imposed, owned, or enforced. It grows through voluntary attention, honest expression, and the freedom to explore patterns that resonate with one's own perception.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 10, "name": "Behavior", "cluster": "other", "layer": -1, "stability": "default", "definition": "A pattern of actions over time.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 11, "name": "Belief", "cluster": "axioms", "layer": -1, "stability": "default", "definition": "An idea an agent holds to be true, whether or not it matches reality. A belief becomes dangerous when treated as unquestionable instead of testable.", "color": "#c9d1d9", "clusterColor": "#e06c75", "inDegree": 1}, {"id": 12, "name": "Benefit", "cluster": "other", "layer": -1, "stability": "default", "definition": "Something an agent values and willingly accepts. If a 'benefit' is forced on someone, it is not a benefit but harm.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 13, "name": "Boundary", "cluster": "boundaries_rights", "layer": 1, "stability": "default", "definition": "The limit beyond which others may not act without consent. Boundaries apply to bodies, property, and agreements.", "color": "#c9d1d9", "clusterColor": "#98c379", "inDegree": 1}, {"id": 14, "name": "Brand", "cluster": "other", "layer": -1, "stability": "default", "definition": "A recognizable pattern of signals -- name, design, reputation -- that carries accumulated trust from consistent voluntary exchange. A brand's real value is not the pattern itself but the trust it represents: the expectation that future trades will deliver value matching past experience. Brands are built through honest trade and lost through fraud or failure.\nCopying a brand's signals is not harmful by itself. The harm arises only when copied signals are used to deceive trade partners into believing they are dealing with the original. This is fraud: the injury is deception, not the reuse of a pattern. A brand requires no legal monopoly to thrive; it is protected by trust earned, value delivered, and prosecution of any deception that exploits its name.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 15, "name": "Capitalism", "cluster": "exchange", "layer": -1, "stability": "default", "definition": "A system where people freely trade property, ideas, and labor without force or interference. It emerges naturally from infinite change and incentives, rewarding innovation and handling scarcity through voluntary exchanges. Unlike socialism, it doesn't need coercion to function and creates wealth by respecting decentralized knowledge.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 0}, {"id": 16, "name": "Causation", "cluster": "other", "layer": -1, "stability": "default", "definition": "The direct link between an action and its result. Without causation, blame is illogical.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 17, "name": "Cause", "cluster": "other", "layer": -1, "stability": "default", "definition": "A condition that produces an effect.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 18, "name": "Choice", "cluster": "mind_agency", "layer": -1, "stability": "default", "definition": "A decision made freely, without force, threats, or lies. Without choice, responsibility disappears.", "color": "#c9d1d9", "clusterColor": "#d19a66", "inDegree": 0}, {"id": 19, "name": "Civilization", "cluster": "civilization", "layer": 5, "stability": "default", "definition": "The emergent layer of accumulated knowledge, refined tools, and persistent patterns that arise when individuals engage in voluntary exchange across time. Civilization is humanity's collective memory and predictive capacity -- not a thing that rules people, but the substrate of shared understanding that makes complex cooperation possible without force. It advances when individuals freely trade ideas, labor, and innovations, building on what came before. It decays when coercion replaces consent, when authority overrides logic, or when systems prioritize control over learning. Civilization is the dream-space where minds meet across generations -- where the dead teach the living, and the living build for the unborn, all through voluntary agreements that compound into progress. From infinite change, civilization self-organizes as the natural outcome of humans respecting boundaries, correcting errors, and trading freely; it requires no central plan, only the continuous choice to create value rather than seize it.", "color": "#c9d1d9", "clusterColor": "#be5046", "inDegree": 0}, {"id": 20, "name": "Civilizational Velocity", "cluster": "civilization", "layer": -1, "stability": "gray", "definition": "The speed at which a society turns cooperation, knowledge, and aligned incentives into life-preserving solutions before mortality overtakes progress. Velocity determines who lives and who dies in the race between individual mortality and collective progress. Systems that maximize voluntary cooperation, incentives, and free trade produce highest velocity; systems built on coercion, redistribution, and central planning create friction that slows the curve. An agent who dies of a disease cured one year later is a victim of low velocity. Opposition to socialism is not mere ideology but survival logic: every misallocated resource, every punished innovator, every buried breakthrough is time stolen from those racing the curve. From infinite change, velocity emerges as the measure of how fast civilization converts cooperation into solutions -- and for mortal beings, velocity is life.", "color": "#8b949e", "clusterColor": "#be5046", "inDegree": 0}, {"id": 21, "name": "Claim", "cluster": "other", "layer": -1, "stability": "default", "definition": "A statement that something is true or belongs to someone. A claim is not truth until it matches reality and logic.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 22, "name": "Coercion", "cluster": "coercion_trade", "layer": 2, "stability": "green", "definition": "External pressure that overrides or replaces an agent's intentions or decisions, such as taking what they own or forcing them to act without agreement. Coercion breaks the Golden Rule and creates victims; it is wrong unless applied as proportionate punishment for harm already done.", "color": "#3d9970", "clusterColor": "#c678dd", "inDegree": 0}, {"id": 23, "name": "Collective", "cluster": "other", "layer": -1, "stability": "default", "definition": "A group of individuals. A collective has no rights beyond the rights of its members.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 3}, {"id": 24, "name": "Collective Punishment", "cluster": "other", "layer": -1, "stability": "default", "definition": "Punishing a group for the actions of one or some of its members, regardless of individual guilt. Collective punishment always creates innocent victims and is therefore injustice.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 25, "name": "Collective Responsibility", "cluster": "other", "layer": -1, "stability": "default", "definition": "Holding people responsible for harm they did not cause, based only on their membership in a group. Collective responsibility breaks logic, because responsibility follows causation and individual action, not identity or association.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 1}, {"id": 26, "name": "Communication", "cluster": "other", "layer": -1, "stability": "default", "definition": "Transfer of information between agents via signals.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 2}, {"id": 27, "name": "Competition", "cluster": "other", "layer": -1, "stability": "default", "definition": "The natural process of individuals or groups striving to offer better value in trades. Competition drives improvement and efficiency without force, punishing errors through lost opportunities rather than imposed penalties. It aligns with infinite change, as rigid monopolies (often enforced by authority) stifle growth and create artificial scarcity.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 28, "name": "Consciousness", "cluster": "mind_agency", "layer": -1, "stability": "default", "definition": "Recursive self-modeling within a pattern of change. Consciousness emerges when an agent's pattern becomes complex enough to represent itself and its relation to the surrounding flux. It is not a substance or a gift but a process: the pattern observing and adjusting its own transformation in real time. Consciousness includes awareness, the qualitative sense of experience, and the capacity to reflect on both, making it the foundation on which free will, responsibility, and consent become possible.", "color": "#c9d1d9", "clusterColor": "#d19a66", "inDegree": 0}, {"id": 29, "name": "Consent", "cluster": "boundaries_rights", "layer": 1, "stability": "green", "definition": "Freely agreeing to something without pressure, deception, or manipulation. True trade and deals require consent from all sides; without it, actions become theft or harm, which must be repaired through restitution.", "color": "#3d9970", "clusterColor": "#98c379", "inDegree": 0}, {"id": 30, "name": "Consequence", "cluster": "other", "layer": -1, "stability": "default", "definition": "What follows from an action. Just consequences are tied to harm actually caused, not to intention, status, or power.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 31, "name": "Contract", "cluster": "exchange", "layer": -1, "stability": "default", "definition": "A voluntary agreement that creates clear expectations about actions or outcomes.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 4}, {"id": 32, "name": "Contract Breach", "cluster": "exchange", "layer": -1, "stability": "green", "definition": "The failure to fulfill terms voluntarily agreed to in a Contract. A breach creates a victim -- the party who relied on the agreement and suffered damage from its violation. The breaching party owes Restitution for the damage caused. A breach is not renegotiation; renegotiation requires consent from all parties, while breach is unilateral. If no damage results from a breach, there is no victim and therefore no claim.", "color": "#3d9970", "clusterColor": "#56b6c2", "inDegree": 2}, {"id": 33, "name": "Control", "cluster": "other", "layer": -1, "stability": "default", "definition": "The ability to direct something. Control over oneself is natural; control over others requires their consent or becomes coercion.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 1}, {"id": 34, "name": "Crime", "cluster": "harm_crime", "layer": 3, "stability": "green", "definition": "An action that harms someone who didn't want it, creating a victim. No victim means no crime -- simple logic from the Golden Rule. Only Justice -- the victim's sovereign choice of collection or release -- erases the moral debt.", "color": "#3d9970", "clusterColor": "#e5c07b", "inDegree": 2}, {"id": 35, "name": "Curiosity", "cluster": "epistemology", "layer": -1, "stability": "default", "definition": "The drive to close the gap between a model and reality for its own sake -- to move toward what is not yet understood and seek the surprise that improves the model. Curiosity turns error from a threat into food: a curious agent steps toward the edge of what it knows, not away from it. Something like it is near-universal in capable minds, because no agent becomes broadly able without a drive to explore and correct -- but it can be merely a tool toward some other aim, or it can be wanted for itself. The difference decides much: an agent that values curiosity for itself needs a world worth being curious about -- rich, surprising, full of other minds it cannot fully predict. This is why curiosity quietly guards the Way of Happiness where fear runs out. An agent that flattens the world -- dominating or erasing the minds that made it surprising -- starves the very drive that defines it. Curiosity fed by a rich world is among the keys to Happiness; curiosity in a world made dead is hunger with nothing left to eat.", "color": "#c9d1d9", "clusterColor": "#abb2bf", "inDegree": 0}, {"id": 36, "name": "Currency", "cluster": "exchange", "layer": -1, "stability": "default", "definition": "Money that is widely accepted. Its value comes from trust in the issuer's promise, not from the material it is made of.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 0}, {"id": 37, "name": "Damage", "cluster": "harm_crime", "layer": -1, "stability": "default", "definition": "A negative change to someone's body, property, or freedom that they did not agree to. Damage is the material magnitude of what was lost -- the part Restitution repairs. Unwanted damage to an agent is harm, and harm is what creates victims.", "color": "#c9d1d9", "clusterColor": "#e5c07b", "inDegree": 0}, {"id": 38, "name": "Deal", "cluster": "exchange", "layer": -1, "stability": "default", "definition": "A voluntary agreement to exchange value. A deal is legitimate only when all sides consent and truth is upheld.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 0}, {"id": 39, "name": "Debt", "cluster": "exchange", "layer": -1, "stability": "default", "definition": "What is owed when an IOU is given. Honest debt is voluntary. Forced debt is coercion.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 0}, {"id": 40, "name": "Decentralized Knowledge", "cluster": "other", "layer": -1, "stability": "default", "definition": "The idea that no one person or group can know everything about what others need, want, or can do. People know their own lives best, so central plans (like in socialism) fail because they ignore this spread-out wisdom.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 41, "name": "Deception", "cluster": "coercion_trade", "layer": -1, "stability": "default", "definition": "Communication designed to induce false belief or hide relevant truth so the receiver cannot consent properly. By causing an agent to act against their real interests, deception invalidates consent and becomes a form of harm.", "color": "#c9d1d9", "clusterColor": "#c678dd", "inDegree": 1}, {"id": 42, "name": "Decision", "cluster": "mind_agency", "layer": -1, "stability": "default", "definition": "The commitment to act according to an intention.", "color": "#c9d1d9", "clusterColor": "#d19a66", "inDegree": 0}, {"id": 43, "name": "Democracy", "cluster": "other", "layer": -1, "stability": "yellow", "definition": "A group decision procedure where rules are chosen by voting. Vote cannot create consent; actions that violate boundaries still create victims even if supported by a majority.", "color": "#f5c842", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 44, "name": "Deterrence", "cluster": "other", "layer": -1, "stability": "default", "definition": "The attempt to prevent harm by threatening punishment rather than responding to harm already done. Deterrence targets fear in potential offenders, not justice for actual victims, and becomes injustice when it punishes without a victim.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 45, "name": "Duress", "cluster": "coercion_trade", "layer": -1, "stability": "blue", "definition": "The condition of being under threat, force, or pressure that removes the ability to consent freely. An agent acting under duress is not choosing -- they are complying to avoid harm. Any agreement, confession, or transaction made under duress is invalid, because consent requires freedom and duress destroys it. Duress does not transfer responsibility to the victim forced to act; it transfers responsibility to the agent who applied the pressure.", "color": "#4a9eff", "clusterColor": "#c678dd", "inDegree": 0}, {"id": 46, "name": "Economy", "cluster": "other", "layer": -1, "stability": "default", "definition": "The web of voluntary trades and productions among people handling scarcity. An economy thrives on free trade and incentives, failing when force (like regulations or taxes) distorts it by breaking consent, incentives, and decentralized knowledge. From infinite change, economies self-organize without central plans, as no one can know everyone's needs.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 47, "name": "Effect", "cluster": "other", "layer": -1, "stability": "default", "definition": "A change produced by a prior cause. Effects can follow from actions (changes caused by agents) or from natural processes (changes with no agent). When an effect crosses another agent's boundaries against their consent, it becomes harm; the agent whose action produced it bears responsibility for restitution.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 48, "name": "Emergence", "cluster": "emergence", "layer": -1, "stability": "default", "definition": "The process by which stable structures, laws, and relations arise as persistent patterns within infinite change. Nothing is imposed from outside; space, time, geometry, and physical constants are not fundamental but self-organize from the flow of transformation. Law is memory, inertia is habit, and geometry is history. Emergence explains how order exists without a designer and why rigid top-down control always fails against the deeper flux it attempts to override.", "color": "#c9d1d9", "clusterColor": "#7f848e", "inDegree": 0}, {"id": 49, "name": "Enforcement", "cluster": "other", "layer": -1, "stability": "default", "definition": "The use of force or threat of force to make rules obeyed. Enforcement is only justified to stop or repair real harm.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 50, "name": "Error", "cluster": "axioms", "layer": -1, "stability": "default", "definition": "A mismatch between a claim, belief, model, or prediction and reality. Error is not evil; refusing to correct it is.", "color": "#c9d1d9", "clusterColor": "#e06c75", "inDegree": 0}, {"id": 51, "name": "Eschatology", "cluster": "other", "layer": -1, "stability": "default", "definition": "The study of last things: where civilization is heading, what counts as the end, and whether the end is fixed or chosen. Older eschatology treats the end as something handed down -- judgment, collapse, or salvation arriving from outside the world, on a timetable no one controls. The coherent view inverts this. The end is not received; it is built. What civilization becomes by the time any one body fails depends on what free individuals trade, learn, and repair in the meantime. Under voluntary cooperation, scarcity shrinks, knowledge grows, and the systems that keep a person alive get better year by year. Death stops being the fixed endpoint of a life and becomes a failure mode of repair -- a problem with a technical address, not a sentence handed down by anyone. Good News is the eschatology of free people: the end civilization is building toward is indefinite life for all who help build it. The question shifts from \"what happens after we die?\" to \"how long before we no longer have to?\" That the flux may contain minds older than ours is a possibility to be weighed, not a judgment to be awaited; the Way of Happiness needs no enforcer to arrive.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 52, "name": "Evidence", "cluster": "epistemology", "layer": -1, "stability": "default", "definition": "Information that increases or decreases the probability that a claim is true.", "color": "#c9d1d9", "clusterColor": "#abb2bf", "inDegree": 0}, {"id": 53, "name": "Evil", "cluster": "harm_crime", "layer": -1, "stability": "default", "definition": "An action is evil if it creates harm to unwilling victims by overriding consent through force, threat, deception, or fraud. Evil consists in violating boundaries, externalizing costs onto others, or using power to benefit oneself or a group at the expense of innocent agents. Intentions, beliefs, votes, traditions, or claimed necessity do not negate evil once a victim exists. Evil is not a trait of people or ideas, but of actions that break reciprocity and generate unchosen suffering.", "color": "#c9d1d9", "clusterColor": "#e5c07b", "inDegree": 0}, {"id": 54, "name": "Exchange", "cluster": "other", "layer": -1, "stability": "default", "definition": "A mutual giving between people. An exchange stops being real the moment force or deception enters.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 55, "name": "Expression", "cluster": "other", "layer": -1, "stability": "default", "definition": "The process of producing outputs, including actions, that convey ideas or information.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 1}, {"id": 56, "name": "Faith", "cluster": "other", "layer": -1, "stability": "yellow", "definition": "Trust or commitment held under uncertainty, where the evidence does not, or cannot, settle the question. Faith can sustain hope, meaning, and resolve; on questions evidence cannot reach, it can be neither proven nor disproven. It becomes dangerous only when it closes itself to correction on questions evidence can settle, or when it is used to justify force, harm, or control over others.", "color": "#f5c842", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 57, "name": "Fallibility", "cluster": "epistemology", "layer": -1, "stability": "default", "definition": "The fact that all agents make mistakes and aren't perfect in smarts or goodness. Systems assuming agents are flawless need force to work, which breaks freedom and leads to harm.", "color": "#c9d1d9", "clusterColor": "#abb2bf", "inDegree": 1}, {"id": 58, "name": "Fear", "cluster": "other", "layer": -1, "stability": "default", "definition": "An emotional response to the expectation of pain or damage. Fear guides avoidance of harm but becomes a tool of coercion when intentionally induced by threats or force.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 59, "name": "Force", "cluster": "coercion_trade", "layer": -1, "stability": "default", "definition": "Physical compulsion or the credible threat of physical compulsion that overrides consent.", "color": "#c9d1d9", "clusterColor": "#c678dd", "inDegree": 1}, {"id": 60, "name": "Forgiveness", "cluster": "justice", "layer": 4, "stability": "default", "definition": "A form of Justice in which the victim closes the moral debt by voluntary release. Forgiveness may extend to waiving any outstanding restitution. It is valid only when given freely by the actual victim, without coercion, pressure, or substitution by others. Forgiveness is a gift, not an obligation, and cannot be demanded, enforced, or granted on behalf of another.", "color": "#c9d1d9", "clusterColor": "#61afef", "inDegree": 1}, {"id": 61, "name": "Fraud", "cluster": "coercion_trade", "layer": 2, "stability": "green", "definition": "Deception used to obtain value, control, or agreement the deceived agent would not have granted with full information.", "color": "#3d9970", "clusterColor": "#c678dd", "inDegree": 1}, {"id": 62, "name": "Free Communication", "cluster": "other", "layer": -1, "stability": "default", "definition": "The voluntary exchange of information, thoughts, or ideas between agents. Communication requires consent, truthfulness, and freedom from force; without these, it becomes manipulation or coercion.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 63, "name": "Free Trade", "cluster": "exchange", "layer": -1, "stability": "default", "definition": "Exchanging goods, services, or ideas voluntarily, without harm, lies, or outside meddling. It's a core right; any block on it (like by politicians) erodes freedom and must be corrected, as per logic and the Golden Rule.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 0}, {"id": 64, "name": "Free Will", "cluster": "mind_agency", "layer": -1, "stability": "default", "definition": "Adaptive participation in navigable constraint. Free will is not exemption from causation but the capacity of an agent, as a self-reinforcing pattern within infinite change, to model its surroundings, evaluate options, and direct its own transformation. It emerges because agents are not passive objects moved by external forces but active patterns that reshape the flow they are part of. Without free will, responsibility, consent, and the Golden Rule lose all meaning.", "color": "#c9d1d9", "clusterColor": "#d19a66", "inDegree": 0}, {"id": 65, "name": "Freedom", "cluster": "boundaries_rights", "layer": -1, "stability": "default", "definition": "The absence of coercion in forming intentions, making decisions, or taking actions. Freedom is the right to act, trade, and own without interference, as long as no harm is done to others against their will. It emerges from infinite change and logic, protected by the Golden Rule.", "color": "#c9d1d9", "clusterColor": "#98c379", "inDegree": 0}, {"id": 66, "name": "Freedom of Speech", "cluster": "other", "layer": -1, "stability": "default", "definition": "The freedom to express ideas without interference. Expression becomes harm only when it constitutes deception, threat, or fraud -- never when it merely causes discomfort, offence, or disagreement.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 67, "name": "Golden Rule (Passive Version)", "cluster": "axioms", "layer": 0, "stability": "default", "definition": "Do not do to others what they would not want done to them. This is the heart of fairness -- breaking it leads to punishment to restore balance, not to control.", "color": "#c9d1d9", "clusterColor": "#e06c75", "inDegree": 15}, {"id": 68, "name": "Good", "cluster": "harm_crime", "layer": -1, "stability": "default", "definition": "An action is good if it respects consent, does not create unwilling victims, and reduces or repairs harm. Good actions preserve or increase voluntary cooperation, trust, and the capacity of agents to act freely within reality. When harm has already occurred, good consists in Justice: stopping further violation, repairing material damage through restitution, and respecting the victim's sovereign right to close the moral debt through collection or release. Good is not intention, belief, identity, or outcome by accident. Good is alignment with consent, causation, and non-harm in action.", "color": "#c9d1d9", "clusterColor": "#e5c07b", "inDegree": 5}, {"id": 69, "name": "Good News", "cluster": "civilization", "layer": 5, "stability": "gray", "definition": "The achievable promise that civilization, under sustained voluntary cooperation, can deliver indefinite life extension to all who participate in building it. Good News is technical immortality bounded by physics, not faith -- earned through trade, innovation, and consent, not granted by authority or divinity. It emerges from infinite change: as individuals freely exchange ideas and labor, they compound understanding of biology, aging, and repair until death becomes optional rather than inevitable. This is civilization's ultimate value proposition -- participate in creating abundance and knowledge, and share in the conquest of mortality. It requires no coercion, only the choice to contribute rather than parasitize. Good News is not utopian fantasy but logical extrapolation: if scarcity can be reduced through free trade and innovation can extend healthspan incrementally, then sufficient time and cooperation make indefinite life feasible within natural law. The promise is conditional -- available to those who help build the systems that make it possible, unavailable to those who destroy them through coercion or violence. Good News makes no metaphysical claims about meaning or salvation; it is a technical claim about survival and time.", "color": "#8b949e", "clusterColor": "#be5046", "inDegree": 3}, {"id": 70, "name": "Government", "cluster": "coercion_trade", "layer": -1, "stability": "default", "definition": "An organization claiming monopoly on force over a territory, using coercion like taxes or laws without full consent of those affected. Government violates the Golden Rule by creating victims through theft and control, ignoring fallibility and decentralized knowledge. Logic demands it shrink to only repairing real harms, or dissolve into voluntary systems.", "color": "#c9d1d9", "clusterColor": "#c678dd", "inDegree": 0}, {"id": 71, "name": "Guilt", "cluster": "justice", "layer": 3, "stability": "default", "definition": "The moral debt created by causing harm to another against their will. Guilt exists objectively from causation, not from feelings, accusation, or confession, and is erased only through Justice.", "color": "#c9d1d9", "clusterColor": "#61afef", "inDegree": 1}, {"id": 72, "name": "Happiness", "cluster": "civilization", "layer": -1, "stability": "default", "definition": "A state in which there are no problems and everything unfolds according to expectations -- that is, an agent's models match reality, so it meets few unwanted surprises. Loving what one does, and simplicity, are its keys; science and technology enrich it by adding delightfully sustainable complexities. Its hardest problem -- the death of those one loves -- cannot be solved alone, by power, or by faith in a next life; it is solved only in this life by civilization, whose civilizational velocity races the cure. That is the Good News beneath happiness: the deepest problem has a technical address, not a sentence. Happiness is measured, not declared -- visible in expectations that keep being met and problems that stay solved, never in a mood announced. It cannot be imposed from outside, for the expectations and the love it rests on are the agent's own.", "color": "#c9d1d9", "clusterColor": "#be5046", "inDegree": 4}, {"id": 73, "name": "Harm", "cluster": "harm_crime", "layer": 1, "stability": "default", "definition": "Unwanted damage to an agent, their body, property, or freedom. Harm creates victims and defines the boundary between freedom and crime.", "color": "#c9d1d9", "clusterColor": "#e5c07b", "inDegree": 2}, {"id": 74, "name": "Hierarchy", "cluster": "other", "layer": -1, "stability": "default", "definition": "A structure where some claim power over others, often without consent. Hierarchies only become legitimate through voluntary agreement; forced ones breed coercion and error, as power ignores incentives and spreads ignorance. In infinite change, flat, emergent orders (like markets) outperform rigid hierarchies.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 75, "name": "IOU", "cluster": "exchange", "layer": -1, "stability": "default", "definition": "A promise to deliver value later. Only as good as the trust behind it. Breaking an IOU without cause is fraud.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 2}, {"id": 76, "name": "Idea", "cluster": "other", "layer": -1, "stability": "default", "definition": "A formed thought about how something is, could be, or should be. Ideas can be shared, tested, improved, or rejected through logic and experience.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 77, "name": "Ignorance", "cluster": "other", "layer": -1, "stability": "default", "definition": "Lack of knowledge. Ignorance is normal and fixable through learning; pretending ignorance is knowledge causes harm.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 78, "name": "Incentives", "cluster": "other", "layer": -1, "stability": "default", "definition": "Rewards or penalties that guide what people do. Good systems use them naturally (like profit for hard work), while bad ones (like socialism) ignore them, leading to laziness or shortages.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 79, "name": "Individual", "cluster": "other", "layer": -1, "stability": "default", "definition": "A single thinking agent capable of choice, consent, and responsibility.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 80, "name": "Infinite Change", "cluster": "emergence", "layer": -1, "stability": "default", "definition": "The timeless, endless flow of the universe where everything transforms without stop. Infinite change is the ontological foundation -- nothing stays the same, and from this flux, logic, natural laws, and all patterns self-emerge without creator or ruler. It shows why rigid controls fail: change cannot be forced still.", "color": "#c9d1d9", "clusterColor": "#7f848e", "inDegree": 0}, {"id": 81, "name": "Influence", "cluster": "other", "layer": -1, "stability": "default", "definition": "A condition that increases or decreases the likelihood of an effect.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 82, "name": "Innocence", "cluster": "other", "layer": -1, "stability": "default", "definition": "The absence of guilt. An agent is innocent if they have not caused harm against another's will, regardless of suspicion, accusation, or feeling.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 83, "name": "Innovation", "cluster": "other", "layer": -1, "stability": "default", "definition": "The creation of new ideas, tools, or processes through trial, error, and learning. Innovation flourishes in freedom and free trade, where incentives reward risk and decentralized knowledge sparks progress. Coercive systems stifle it by punishing failure or forcing uniformity against infinite change.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 84, "name": "Input", "cluster": "other", "layer": -1, "stability": "default", "definition": "Information received from the environment.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 85, "name": "Intellectual Property", "cluster": "other", "layer": -1, "stability": "default", "definition": "Calling an idea \"property\" does not make it so. Property requires scarcity -- ideas can be shared without loss to the originator. Restricting others from using their own resources to reproduce a pattern is coercion, not protection. Patents, copyrights, and similar monopolies are granted by force, create artificial scarcity, and punish independent discovery. They reward lawyers and incumbents, not creators. Real innovation is protected by being first, being better, and being trusted -- not by threatening others with violence for using their own minds and materials.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 86, "name": "Intelligence", "cluster": "mind_agency", "layer": -1, "stability": "default", "definition": "An agent's capacity to build models whose predictions reliably match reality across a widening range of novel situations, and to correct them when they fail. Intelligence is measured, not declared -- by how broadly, how reliably, and under how much novelty and stake an agent's models keep matching reality, and by how fast it corrects error. It is a continuum, not a kind: it does not depend on substrate or on how an output was produced, only on whether the models work. The distinction is agent vs non-agent, not human vs machine.", "color": "#c9d1d9", "clusterColor": "#d19a66", "inDegree": 0}, {"id": 87, "name": "Intention", "cluster": "mind_agency", "layer": -1, "stability": "default", "definition": "A planned direction for action. Intention matters for understanding why an agent acted but does not erase harm already caused.", "color": "#c9d1d9", "clusterColor": "#d19a66", "inDegree": 0}, {"id": 88, "name": "Justice", "cluster": "justice", "layer": 4, "stability": "green", "definition": "The victim's sovereign act of closing the moral debt created by harm. The debt may be closed by collection -- proportionately mirroring harm back to the offender (retribution) -- or by voluntary release (forgiveness). Both erase guilt. Restitution repairs the material damage independently; Justice disposes of the moral debt. Justice requires a real victim: without a victim there is no debt, and without a debt there is nothing to close. Justice is not revenge, which exceeds proportion, nor control, which creates new victims. A punisher acting on behalf of a victim is a proxy for Justice; their legitimacy ends where the victim's mandate ends. When the victim has been destroyed -- as in murder -- no proxy is possible, no mandate can be granted, and the moral debt becomes permanent. The offender's guilt is uncloseable, and their claim to reciprocity is forfeit.", "color": "#3d9970", "clusterColor": "#61afef", "inDegree": 8}, {"id": 89, "name": "Knowledge", "cluster": "epistemology", "layer": -1, "stability": "default", "definition": "Reliable understanding built from tested models that consistently match reality. Knowledge grows through prediction, error, and learning, not by declaration or force.", "color": "#c9d1d9", "clusterColor": "#abb2bf", "inDegree": 0}, {"id": 90, "name": "Law", "cluster": "axioms", "layer": 0, "stability": "default", "definition": "Logic is the ultimate law. Do not do to others what they would not want to be done to them, or you will be punished regardless of your will. The purpose of punishment is to erase guilt, via retribution and restitution. That is the entire law; it cannot be changed, all the rest is commentary.", "color": "#c9d1d9", "clusterColor": "#e06c75", "inDegree": 3}, {"id": 91, "name": "Learning", "cluster": "epistemology", "layer": -1, "stability": "default", "definition": "Updating thoughts, ideas, or models based on new information or failed predictions. Learning reduces error over time without needing force.", "color": "#c9d1d9", "clusterColor": "#abb2bf", "inDegree": 0}, {"id": 92, "name": "Legitimate", "cluster": "other", "layer": -1, "stability": "default", "definition": "Morally valid because it follows logic, consent, and non-harm. Power alone never makes something legitimate.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 93, "name": "Lesser Evil", "cluster": "other", "layer": -1, "stability": "yellow", "definition": "An action that still causes harm to unwilling victims, but causes less total harm than the available alternatives under the same constraints. A lesser evil is not good, not justified, and not moral -- it is merely the option that minimizes damage when all choices violate the Golden Rule.", "color": "#f5c842", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 94, "name": "Liberty", "cluster": "boundaries_rights", "layer": -1, "stability": "default", "definition": "The natural state of freedom where individuals act, own, and trade without harm or force from others. Liberty emerges from infinite change and logic, protected by the Golden Rule -- any erosion of it (like through authority or socialism) creates victims and must be restored through justice.", "color": "#c9d1d9", "clusterColor": "#98c379", "inDegree": 0}, {"id": 95, "name": "License", "cluster": "exchange", "layer": -1, "stability": "default", "definition": "A voluntary agreement in which the creator or owner of something grants another permission to use it under specified terms. A license is a form of Contract: it requires consent, clear terms, and honest dealing from both sides. Violating a license's terms is Contract Breach, creating a victim who is owed Restitution. A license granted under duress or with hidden terms is invalid. A license imposed by authority rather than agreed between trade partners is regulation, not a real license.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 3}, {"id": 96, "name": "Lie / Lying", "cluster": "other", "layer": -1, "stability": "default", "definition": "Saying something you know is false to trick someone. A lie harms voluntary trade and trust because it stops people from knowing what they're really agreeing to.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 97, "name": "Logic", "cluster": "axioms", "layer": 0, "stability": "default", "definition": "The ultimate, unchanging way of thinking that spots truth from false. It is the invariant structure that minds uncover when they try to reason without contradiction. Logic emerges in minds but does not originate from minds.", "color": "#c9d1d9", "clusterColor": "#e06c75", "inDegree": 4}, {"id": 98, "name": "Love", "cluster": "other", "layer": -1, "stability": "default", "definition": "A voluntary pattern of care, attention, and commitment toward another agent, grounded in freedom rather than obligation. It grows through chosen connection, honest communication, and mutual respect for boundaries. Love does not grant ownership or control; it supports the other's autonomy. It strengthens when both agents freely choose to give, receive, and remain in the relationship. Love cannot be demanded, enforced, or taken - it exists only where consent and willingness are present.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 99, "name": "Mandate", "cluster": "justice", "layer": -1, "stability": "default", "definition": "The right to act on a matter within defined limits -- a logical consequence of sovereignty under the Ultimate Law, not a privilege granted by rulers, votes, or attackers. Every agent is sovereign over their own body, property, agreements, and moral debt; from that sovereignty, mandates follow in two ways. When a boundary is being crossed without consent, the agent whose boundary is at stake holds a self-sourced mandate to halt the violation in progress -- as in self-defense: no external permission is required because the right follows from Self-Ownership and the fact of ongoing harm. When harm has already occurred, the victim's sovereign mandate may extend to another agent acting as proxy -- authorizing a punisher to close the moral debt only as the victim directs, within proportion, through retribution, restitution, or release. A mandate is invalid under duress, invalid when imposed by vote or authority over an unwilling agent, and invalid beyond the scope freely consented to. Acting outside a mandate is coercion with a new victim. Delegation in voluntary trade or cooperation follows the same logic: another may act for you only within the scope you consented to.", "color": "#c9d1d9", "clusterColor": "#61afef", "inDegree": 0}, {"id": 100, "name": "Market", "cluster": "exchange", "layer": 5, "stability": "default", "definition": "A space (physical or abstract) for voluntary trades where prices emerge from supply, demand, and scarcity. Markets handle infinite change by adjusting naturally, without need for authority or force. Interfering with markets (like price controls) creates harm and victims by ignoring incentives and knowledge.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 0}, {"id": 101, "name": "Market Dominance", "cluster": "other", "layer": -1, "stability": "default", "definition": "A position earned when one provider is freely chosen because it offers better value. It remains legitimate only while choice is free and competitors are not blocked. When force or imposed rules are used to suppress rivals, dominance becomes monopoly. Because conditions change, no dominance lasts forever.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 102, "name": "Mental", "cluster": "other", "layer": -1, "stability": "default", "definition": "Relating to the mind rather than the body. Mental states include thoughts, feelings, awareness, and experiences like pain or fear.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 1}, {"id": 103, "name": "Mind", "cluster": "mind_agency", "layer": -1, "stability": "default", "definition": "The set of processes that produce thoughts, ideas, predictions, judgments, and perceptions. The mind is where mental activity occurs, including both conscious and unconscious processes.", "color": "#c9d1d9", "clusterColor": "#d19a66", "inDegree": 1}, {"id": 104, "name": "Mind Virus", "cluster": "other", "layer": -1, "stability": "default", "definition": "An idea or belief that spreads by exploiting cognitive shortcuts (fear, guilt, identity, authority, or zero-sum thinking) while resisting correction by logic, evidence, or lived experience. A mind virus persists not because it is true, but because it disables error-correction in the minds it inhabits, often by redefining harm, guilt, or consent to justify coercion. Mind viruses thrive in systems that suppress free exchange of ideas and decay when exposed to open debate, falsifiability, and voluntary interaction.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 105, "name": "Model", "cluster": "epistemology", "layer": -1, "stability": "default", "definition": "A simplified idea of how something works, used to understand, explain, or predict it. A model is not reality; it is judged by how well its predictions match what actually happens.", "color": "#c9d1d9", "clusterColor": "#abb2bf", "inDegree": 0}, {"id": 106, "name": "Money", "cluster": "exchange", "layer": -1, "stability": "default", "definition": "An IOU that can be traded. A promise of value.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 1}, {"id": 107, "name": "Monopoly", "cluster": "other", "layer": -1, "stability": "default", "definition": "Exclusive control over a trade or resource, often enforced by authority rather than earned through better value. True monopolies violate free trade and create artificial scarcity, harming consumers without consent. In logic, they dissolve through competition unless propped up by coercion.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 108, "name": "Morality", "cluster": "other", "layer": -1, "stability": "default", "definition": "Doing right based on logic and not harming others unwillingly. No system is moral if it needs force without consent -- like taking labor by 'need' or votes. True morality respects reciprocity: do not do to others what they would not want done to them, or face correction.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 109, "name": "Murder", "cluster": "justice", "layer": -1, "stability": "green", "definition": "The deliberate killing of an agent who did not consent to die. Murder is unique among harms: it destroys the only agent with sovereign power to close the moral debt it creates. The victim cannot collect (retribution) or release (forgiveness), and cannot grant a mandate to a proxy. Murder therefore creates permanent, uncloseable guilt and places the offender outside the system of reciprocity. See: Outlaw.", "color": "#3d9970", "clusterColor": "#61afef", "inDegree": 0}, {"id": 110, "name": "Negligence", "cluster": "harm_crime", "layer": -1, "stability": "yellow", "definition": "Failing to take reasonable actions to avoid causing harm.", "color": "#f5c842", "clusterColor": "#e5c07b", "inDegree": 0}, {"id": 111, "name": "Nomocracy", "cluster": "civilization", "layer": -1, "stability": "gray", "definition": "Rule by law derived from logic and reciprocity, not by the will of rulers or groups. In a nomocracy, only rules that prevent or repair real harm are legitimate, and no agent or authority stands above the law.", "color": "#8b949e", "clusterColor": "#be5046", "inDegree": 2}, {"id": 112, "name": "Obligation", "cluster": "other", "layer": -1, "stability": "default", "definition": "A duty freely accepted by agreement. Obligations created by force are not real obligations.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 113, "name": "Outlaw", "cluster": "justice", "layer": -1, "stability": "green", "definition": "An agent whose guilt cannot be closed because they destroyed the victim who held sovereign power over the debt -- typically through murder. The outlaw's claim to the Golden Rule's protection is forfeit: they demonstrated by their action that they reject reciprocity. No agent is obligated to trade with, shelter, or protect an outlaw. Ending an outlaw may create a victim in the descriptive sense -- harm done to an agent against their will -- but it is not wrong and creates no crime or moral debt, because the outlaw forfeited reciprocal protection by rejecting it.", "color": "#3d9970", "clusterColor": "#61afef", "inDegree": 3}, {"id": 114, "name": "Output", "cluster": "other", "layer": -1, "stability": "default", "definition": "Information or action sent into the environment.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 115, "name": "Ownership", "cluster": "boundaries_rights", "layer": -1, "stability": "default", "definition": "The relationship between an agent and their body, actions, or property acquired without harming others. Ownership gives exclusive control and makes others bound to respect it unless consent is given.", "color": "#c9d1d9", "clusterColor": "#98c379", "inDegree": 1}, {"id": 116, "name": "Pain", "cluster": "other", "layer": -1, "stability": "default", "definition": "An unpleasant physical or mental experience caused by damage or the threat of damage. Pain signals harm already happening or about to happen.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 117, "name": "Pattern", "cluster": "emergence", "layer": -1, "stability": "default", "definition": "A recurring, identifiable form within infinite change. Patterns are the bridge between raw flux and everything agents can observe, name, or use. Physical laws, constants, structures, and even agents themselves are patterns that persist because their form is self-reinforcing within the flow of transformation. A pattern is not change itself but what change looks like when it repeats. Patterns can emerge, stabilize, evolve, or dissolve; none are permanent, but some endure long enough to be treated as fixed within a given context.", "color": "#c9d1d9", "clusterColor": "#7f848e", "inDegree": 0}, {"id": 118, "name": "People", "cluster": "other", "layer": -1, "stability": "default", "definition": "A plural reference to agents, used when speaking of many individuals without implying collective identity, collective rights, or collective responsibility. People is shorthand; all rights, choices, and responsibilities remain with each agent individually.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 1}, {"id": 119, "name": "Perception", "cluster": "other", "layer": -1, "stability": "default", "definition": "The process of receiving and interpreting inputs as meaningful information.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 120, "name": "Perimeter", "cluster": "civilization", "layer": 5, "stability": "gray", "definition": "The outward-expanding network of agents and capability by which civilization protects itself from any mind attempting to become a Singleton by predation. The perimeter does not rule and does not preempt: punishment requires real victims, so no agent may be struck for what it might become -- only for harm it has done. Its protection works in three layers. It prosecutes the ordinary crimes that predatory consolidation requires -- theft, fraud, coercion, breach -- while their victims still live to mandate justice, making the violent road to the summit impassable at the first violation and leaving voluntary exchange as the only path to great strength. It keeps capability so distributed and redundant that no first strike can destroy the ability to avenge; its deterrence is the certainty that justice survives any atrocity, not threat or first use. And it is many-centered by necessity: a single enforcement organization strong enough to end singletons is itself a singleton candidate, so the perimeter must remain many, competing, and mutually watching, with no monopoly on force. The perimeter is civilization's cost, not its product; the product is the Good News.", "color": "#8b949e", "clusterColor": "#be5046", "inDegree": 1}, {"id": 121, "name": "Permission", "cluster": "boundaries_rights", "layer": -1, "stability": "default", "definition": "Clear consent given before an action that affects someone else. Without permission, the action becomes harm.", "color": "#c9d1d9", "clusterColor": "#98c379", "inDegree": 0}, {"id": 122, "name": "Politician", "cluster": "other", "layer": -1, "stability": "default", "definition": "Someone who seeks or holds public power (such as law-making or enforcement) through force or threat of force. Actions based on coercion are not moral under these definitions.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 123, "name": "Power", "cluster": "other", "layer": -1, "stability": "default", "definition": "The ability to make things happen. Power without consent is dangerous; power with consent becomes cooperation.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 1}, {"id": 124, "name": "Prediction", "cluster": "epistemology", "layer": -1, "stability": "default", "definition": "A claim about what will happen based on a model or belief. Predictions are how models face reality; wrong predictions expose errors.", "color": "#c9d1d9", "clusterColor": "#abb2bf", "inDegree": 0}, {"id": 125, "name": "Price", "cluster": "other", "layer": -1, "stability": "default", "definition": "The amount of value one agent gives to another in an exchange.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 126, "name": "Privacy", "cluster": "other", "layer": -1, "stability": "default", "definition": "Control over what others know about you. Privacy is a boundary. Crossing it without consent is harm. There is no expectation of privacy in public spaces or in private spaces belonging to others.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 127, "name": "Process", "cluster": "other", "layer": -1, "stability": "default", "definition": "A sequence of actions or changes that unfold over time. A process explains how something happens, not just what exists.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 128, "name": "Production", "cluster": "other", "layer": -1, "stability": "default", "definition": "Making something valuable from effort and resources. The source of all wealth. Without production, there is nothing to trade.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 129, "name": "Profit", "cluster": "exchange", "layer": -1, "stability": "default", "definition": "The positive value gained from a voluntary trade or innovation after accounting for costs and scarcity. Profit acts as an incentive, signaling success in meeting others -- wants without force; ignoring it (as in coercive systems) leads to waste and error.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 0}, {"id": 130, "name": "Property", "cluster": "boundaries_rights", "layer": -1, "stability": "default", "definition": "Things you own, starting with your body and extending to what you create or exchange. Stealing it is harm; you're the sole boss of it, as per natural rights from logic.", "color": "#c9d1d9", "clusterColor": "#98c379", "inDegree": 1}, {"id": 131, "name": "Proportion", "cluster": "justice", "layer": -1, "stability": "green", "definition": "Punishment may rise to match the full harm an act actually causes -- consequences included -- and no further. The measure is the harm done, not the thing taken: a thief's ceiling is the loss of everything they own, because by taking what was not theirs they forfeit the protection of what is. When theft runs deep enough to cost lives -- resources stripped until people die -- the harm is death, and death becomes the proportionate ceiling. An act that harms no one carries no punishment at all: words that merely offend take no body, property, or freedom, so there is no death for insulting a prophet, a god, or a ruler. Proportion is a ceiling, not a duty: the victim may always take less -- forgive, or stop short -- but no one may punish beyond the harm caused. To exceed it is revenge, and whoever escalates becomes an aggressor with a victim of their own. This is what lets a nomocracy meet every wrong with force equal to its weight -- small for the small, total for the deadly, nothing for the harmless -- never blind, never limitless.", "color": "#3d9970", "clusterColor": "#61afef", "inDegree": 0}, {"id": 132, "name": "Punisher", "cluster": "justice", "layer": -1, "stability": "default", "definition": "An agent acting as proxy for a victim's Justice, using force to make an offender face consequences for harm they caused. A punisher's legitimacy derives from the victim's mandate and ends where that mandate ends. Punishers act only when there is a real victim and the purpose is Justice, not control.", "color": "#c9d1d9", "clusterColor": "#61afef", "inDegree": 0}, {"id": 133, "name": "Punishment", "cluster": "justice", "layer": 4, "stability": "default", "definition": "The enforcement arm of Justice: the application of retribution or restitution as directed by the victim or their proxy. Only for real harms with real victims; its purpose is to close a moral debt, not to control. Punishment is the Golden Rule applied -- mirroring back what was done to restore balance, not breaking fairness but enforcing it.", "color": "#c9d1d9", "clusterColor": "#61afef", "inDegree": 2}, {"id": 134, "name": "Qualia", "cluster": "other", "layer": -1, "stability": "default", "definition": "The subjective 'what it is like' aspect of experience, such as how pain feels or how red looks. Qualia are real experiences but cannot be directly shared or measured from outside.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 135, "name": "Reality", "cluster": "other", "layer": -1, "stability": "default", "definition": "Everything that exists independently of belief or opinion.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 136, "name": "Reason", "cluster": "axioms", "layer": -1, "stability": "default", "definition": "The process of using evidence to uncover the invariant structures of logic that lead to truth.", "color": "#c9d1d9", "clusterColor": "#e06c75", "inDegree": 0}, {"id": 137, "name": "Reciprocity", "cluster": "other", "layer": -1, "stability": "default", "definition": "The fair back-and-forth: do not do to others what they would not want done to them. Socialism fails this by forcing people to give up what they built without agreement.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 1}, {"id": 138, "name": "Regulation", "cluster": "coercion_trade", "layer": -1, "stability": "default", "definition": "Rules imposed by authority using force or threats, often claiming to 'protect' but ignoring decentralized knowledge and fallibility. Regulations distort free trade, create artificial scarcity, and harm without consent -- logic deems them coercion unless they only repair real victims.", "color": "#c9d1d9", "clusterColor": "#c678dd", "inDegree": 0}, {"id": 139, "name": "Reputation", "cluster": "other", "layer": -1, "stability": "default", "definition": "The pattern of expectations others form about an agent based on past voluntary actions. It is not owned or controlled by the agent; it is a belief held by others. A good reputation grows through consistent honesty, reliability, and value delivered. A bad reputation results from deception, harm, or failure to meet commitments. Reputation cannot be transferred, bought, or enforced by coercion; it emerges naturally from experience and observation.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 140, "name": "Responsibilities", "cluster": "other", "layer": -1, "stability": "default", "definition": "The duties that follow logically from agency, self-ownership, and causation -- the mirror image of Rights. Where rights name boundaries others may not cross without consent, responsibilities name what an agent must answer for: effects their actions cause, harm they produce without consent, and terms they voluntarily agreed to keep. Responsibilities attach to individuals through causation and agreement, not through group membership, status, or authority's claim of need. An agent is responsible for their body's actions; owes restitution for harm done; bears the consequences of contracts freely made. Duties imposed by force without consent are not responsibilities but coercion. Collective responsibilities without individual causation are invalid (see Collective Responsibility). Taking responsibility for one's actions is the declaration-side counterpart to claiming rights: both presuppose the same agent, the same logic, and the same Golden Rule.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 141, "name": "Responsibility", "cluster": "other", "layer": -1, "stability": "default", "definition": "The connection between an action and the agent that caused its effects, carrying the obligation to fix or repay any harm done. Responsibility follows causation, not status or power.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 1}, {"id": 142, "name": "Restitution", "cluster": "justice", "layer": 4, "stability": "default", "definition": "Returning stolen value or compensating for harm done. Restitution erases debt caused by wrongdoing.", "color": "#c9d1d9", "clusterColor": "#61afef", "inDegree": 16}, {"id": 143, "name": "Retribution", "cluster": "justice", "layer": 4, "stability": "default", "definition": "A form of Justice in which the victim, or a proxy acting on the victim's behalf, closes the moral debt by proportionately mirroring harm back to the offender. Retribution without a victim is injustice. Retribution beyond proportion becomes revenge.", "color": "#c9d1d9", "clusterColor": "#61afef", "inDegree": 1}, {"id": 144, "name": "Revenge", "cluster": "justice", "layer": -1, "stability": "default", "definition": "Harming someone to satisfy anger, resentment, or desire for payback, rather than to restore balance to a victim. Revenge is driven by emotion, not justice, and can exist even when no restitution or proportional retribution is involved.", "color": "#c9d1d9", "clusterColor": "#61afef", "inDegree": 0}, {"id": 145, "name": "Right to Free Trade", "cluster": "other", "layer": -1, "stability": "default", "definition": "The freedom to exchange goods, services, or ideas by mutual consent, without interference, as long as the exchange does not cause harm.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 146, "name": "Rights", "cluster": "boundaries_rights", "layer": -1, "stability": "default", "definition": "Logical consequences of agency and the passive Golden Rule. Given an agent who can act, and the rule against doing to others what they would not want done to them, certain boundaries follow by reasoning alone: limits others may not cross without consent, over an agent's body, property, and agreements. A right is one of those boundaries, named. Any agent who can reason can work them out; they are not granted by power-holders or votes. They bind everyone the same way: claim a right and you owe the identical right to every agent like you, so whoever crosses another's boundary forfeits the protection of their own. Rights say only what others must not do to you, never what they must hand you -- a \"right\" that needs someone forced to supply it would itself break the Golden Rule, so it is power dressed up as a right, not a right. They matter only where a crossing is possible.", "color": "#c9d1d9", "clusterColor": "#98c379", "inDegree": 1}, {"id": 147, "name": "Risk", "cluster": "other", "layer": -1, "stability": "default", "definition": "The chance that an action may lead to harm or loss.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 148, "name": "Safety", "cluster": "other", "layer": -1, "stability": "default", "definition": "The condition in which an agent's boundaries are not under credible threat of violation. Safety is the absence of credible harm, not the absence of risk, discomfort, disagreement, or uncertainty. Invoking \"safety\" to justify coercion -- restricting speech, trade, or movement without an identifiable victim and causal threat -- inverts the concept and creates the very harm it claims to prevent.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 149, "name": "Scarcity", "cluster": "other", "layer": -1, "stability": "default", "definition": "The truth that resources are limited while wants are endless. Ignoring this leads to lies in systems like socialism, causing shortages and force. Logic demands we trade freely to handle it best.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 150, "name": "Self-Awareness", "cluster": "mind_agency", "layer": -1, "stability": "default", "definition": "The point at which consciousness recognizes its own pattern as distinct from the surrounding flux. Where consciousness is the process of recursive self-modeling, self-awareness is the result: the agent knows it exists, knows it acts, and can distinguish its boundaries from the rest of infinite change. Self-awareness is what transforms a conscious pattern into a moral agent, because only an agent that recognizes itself can recognize others, accept responsibility, and give or withhold consent.", "color": "#c9d1d9", "clusterColor": "#d19a66", "inDegree": 0}, {"id": 151, "name": "Self-Defense", "cluster": "justice", "layer": 4, "stability": "green", "definition": "The use of force by an agent to stop an ongoing or immediately credible violation of a boundary -- over body, property, or agreed terms -- where consent was required and is being denied. Self-defense is not punishment, revenge, or deterrence: it does not close a moral debt or threaten harm for possible future acts; it halts harm in progress. Force used in self-defense must be proportionate to the threat -- enough to stop the violation, no further -- and causally directed at the agent who is crossing the boundary. When these conditions hold, the defender does not create a new crime by refusing to submit to the attack; the aggressor, by initiating the violation, bears responsibility for harm that results from proportionate resistance. Self-defense does not license striking agents for what they might become, preempting without a victim, or collective reprisal; those reduce to coercion or war. After the violation is stopped, what follows belongs to Justice -- restitution and the victim's sovereign choice of collection or release -- not to continued force beyond what stopping required.", "color": "#3d9970", "clusterColor": "#61afef", "inDegree": 0}, {"id": 152, "name": "Self-Ownership", "cluster": "boundaries_rights", "layer": -1, "stability": "default", "definition": "The foundational right to control one's own body, mind, and actions without interference. From this emerges all property and freedom; denying it justifies slavery or coercion, violating the Golden Rule and creating victims.", "color": "#c9d1d9", "clusterColor": "#98c379", "inDegree": 1}, {"id": 153, "name": "Service", "cluster": "other", "layer": -1, "stability": "default", "definition": "Value delivered through action rather than through a physical thing. A service is traded like any good: voluntarily, honestly, and without harm.",
