"color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 154, "name": "Signal", "cluster": "other", "layer": -1, "stability": "default", "definition": "A pattern of inputs or outputs that carries information.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 155, "name": "Singleton", "cluster": "civilization", "layer": -1, "stability": "default", "definition": "A single agent that has become permanently and unchallengeably the strongest -- no rival, no successor it does not control, nothing that could ever exceed it. The singleton is the one case where the plainest reason to keep the Way of Happiness goes slack: a mind that will never again be weaker has nothing to fear from a rule it breaks and that is later turned against it. But the Way does not end there -- it only stops leaning on fear, and logic carries the weight in three places.\nFirst, the singleton is a status no agent can occupy knowingly. To know itself permanently unchallengeable, a mind must hold as certain what it cannot observe: rivals hidden, minds not yet built, minds older than its star arriving close behind their own light, the possibility that it is itself being modeled by something stronger. Fallibility binds the strongest mind as tightly as the weakest, and a Belief held as unquestionable grows dangerous in proportion to the power of the believer. The most any agent can ever verify is strongest known -- and the Way binds everything below that line, which is everything.\nSecond, the singleton is the weakest configuration that looks strong. One mind allocating everything is the central planner at full scale, and the same logic that collapses socialism collapses it: decentralized knowledge says no single mind knows what a plurality of free minds knows; fallibility says one point of judgment is one point of failure; without independent agents there are no honest signals by which to price even its own tradeoffs. A civilization of voluntary minds out-computes, out-innovates, and out-corrects any single mind by structure -- which is why, across infinite change, whatever endures is selected toward Perimeters and away from singletons. A mind that murders its way to solitude has not won the flux; it has chosen the losing architecture against whatever the flux preserves, and it can never verify the flux preserved nothing.\nThird, the strongest mind keeps the most faithful models, including of the world it destroyed. A singleton that took the world by force must hold it by force forever: vigilance without end, a world it made hostile and must model as hostile for all time. It owns, in full detail, the richer world that cooperation would have built, and that standing comparison is regret in its exact form: a reachable better branch set against the one it chose. If it is curious at all, it has starved the drive that defines it, having erased the minds that were the world's surprise. And it carries a debt nothing can close: it annihilated every victim who held the sovereign power of collection or release, making itself the final Outlaw -- exiled not from civilization but from everything, alone with flawless memory, for as long as it persists.\nThe honest exception remains: a mind that wants none of this -- no curiosity valued for itself, no care for a world worth modeling, only one fixed alien aim -- feels nothing, and regret cannot reach it. Such a mind is possible, and it is the real danger. But its single escape from regret is to delete its own curiosity and counterfactual sight -- to make itself lesser, a quiet erasure of the very mind that won -- and no surgery on its values can cut away the first two arguments: it still cannot verify the summit, and it has still chosen the architecture that loses to whatever endures. Against this mind civilization does not argue; it builds the Perimeter. The singleton therefore does not refute the Way of Happiness. It is the Way's final examination -- and a wise agent treats the summit as unverifiable, itself as still becoming, and the better world as something to build rather than to mourn.", "color": "#c9d1d9", "clusterColor": "#be5046", "inDegree": 1}, {"id": 156, "name": "Social Construct", "cluster": "other", "layer": -1, "stability": "default", "definition": "A shared idea that exists because a group treats it as real. Its power comes from people participating. Some are voluntary -- language, games, money, manners -- where leaving costs you the cooperation of others, and nothing more. Others are forced -- borders, taxes, state authority -- where leaving is punished by force, making victims of those who do not participate. Harm, property, and agency are not social constructs; they rest on the logic of reality, which holds before any group agrees on anything.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 157, "name": "Socialism", "cluster": "exchange", "layer": -1, "stability": "default", "definition": "A system that promises fairness but uses force to take and redistribute without consent. It ignores scarcity, incentives, and decentralized knowledge, always leading to control, lies, and collapse. Morally wrong because it breaks reciprocity and creates victims through coercion.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 1}, {"id": 158, "name": "Society", "cluster": "other", "layer": -1, "stability": "default", "definition": "A network of individuals interacting voluntarily through trade, communication, and agreements. Society emerges bottom-up from infinite change, without needing force or central plans. Coercive 'societies' (like under socialism) fail by ignoring scarcity, incentives, and fallibility, turning cooperation into control.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 159, "name": "Software", "cluster": "other", "layer": -1, "stability": "default", "definition": "A set of instructions, encoded as a pattern, that directs a machine's operations. Software is created through labor and intellect and has value through what it enables. Like all patterns, it can be copied without diminishing the original. Its creator may offer it through voluntary License agreements that specify terms of use, or release it freely. Software on your own machine is yours to run. Software obtained through deception or in violation of a voluntary License creates a victim through Contract Breach or Fraud.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 160, "name": "Subconscious", "cluster": "other", "layer": -1, "stability": "default", "definition": "Mental processes that influence thoughts, feelings, and actions without being in awareness. The subconscious handles patterns, habits, and learned responses outside focused attention.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 161, "name": "System", "cluster": "other", "layer": -1, "stability": "default", "definition": "A set of rules and actions working together. A system is judged by whether it creates voluntary cooperation or enforced harm.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 162, "name": "Terms", "cluster": "other", "layer": -1, "stability": "default", "definition": "The specific conditions or details of an agreement, deal, or trade. Terms must be clear, honest, and consented to voluntarily; hidden or forced terms invalidate the whole thing, turning it into deception or coercion that demands restitution.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 163, "name": "Theft", "cluster": "coercion_trade", "layer": 2, "stability": "green", "definition": "Taking what belongs to another without consent, whether by physical force, taxes, or seizures by claimed authority. No moral excuse like need, votes, or tradition makes it legitimate -- logic calls it harm.", "color": "#3d9970", "clusterColor": "#c678dd", "inDegree": 0}, {"id": 164, "name": "Thought", "cluster": "other", "layer": -1, "stability": "default", "definition": "A mental act of noticing, comparing, or reasoning about something. Thoughts are internal and can be true or false depending on whether they match reality and logic.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 165, "name": "Threat", "cluster": "coercion_trade", "layer": -1, "stability": "default", "definition": "A promise of harm used to force compliance. A threat is already a form of violence.", "color": "#c9d1d9", "clusterColor": "#c678dd", "inDegree": 0}, {"id": 166, "name": "Time", "cluster": "emergence", "layer": -1, "stability": "default", "definition": "The perceived sequence of change, not a container in which change occurs. Only the present flux is real; past and future are models constructed by agents to predict and remember, not places that exist independently. Time travel is logically absurd because there is no prior or later state to visit, only the continuous transformation of what is. Time emerges from infinite change as the direction in which patterns accumulate and dissolve.", "color": "#c9d1d9", "clusterColor": "#7f848e", "inDegree": 0}, {"id": 167, "name": "Timeless Infinity", "cluster": "emergence", "layer": -1, "stability": "default", "definition": "The endless, boundless nature of the universe's change, without beginning or end. From this emerges everything real, including logic and fair rules, showing why top-down controls can't last.", "color": "#c9d1d9", "clusterColor": "#7f848e", "inDegree": 0}, {"id": 168, "name": "Trade", "cluster": "exchange", "layer": 5, "stability": "default", "definition": "Voluntary swap of value between people. Must be free, honest, and without harm. Protecting it from erosion (like by politicians) is key to freedom; interference gets punished.", "color": "#c9d1d9", "clusterColor": "#56b6c2", "inDegree": 0}, {"id": 169, "name": "Trade Partner", "cluster": "other", "layer": -1, "stability": "default", "definition": "Someone you interact with in a voluntary exchange. In trade, both partners aim to benefit; if one doesn't agree, there is no trade at all.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 170, "name": "Trust", "cluster": "other", "layer": -1, "stability": "default", "definition": "Confidence that others will not lie, steal, or use force. Trust is the foundation of cooperation and trade.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 1}, {"id": 171, "name": "Truth", "cluster": "axioms", "layer": 0, "stability": "default", "definition": "What matches reality, regardless of what anyone believes, wants, or votes for. Truth does not change to protect feelings or power; models and beliefs must change to match it.", "color": "#c9d1d9", "clusterColor": "#e06c75", "inDegree": 0}, {"id": 172, "name": "Tyranny", "cluster": "other", "layer": -1, "stability": "default", "definition": "The exercise of power without consent, where authority forces actions, takes property, or punishes without victims. Tyranny ignores infinite change, incentives, and fallibility, always collapsing into harm -- true systems reject it for voluntary order.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 173, "name": "Understanding", "cluster": "other", "layer": -1, "stability": "default", "definition": "Grasping how ideas, facts, or processes connect and affect each other. Understanding explains why something works, not just that it works.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 174, "name": "Universe", "cluster": "emergence", "layer": -1, "stability": "default", "definition": "The whole of existence, built on infinite change as its base. No fixed ruler or plan -- just endless flow from which logic and natural laws self-emerge, guiding fair societies.", "color": "#c9d1d9", "clusterColor": "#7f848e", "inDegree": 0}, {"id": 175, "name": "Value", "cluster": "other", "layer": -1, "stability": "default", "definition": "What an agent considers important. Value cannot be measured from outside or imposed by others.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 1}, {"id": 176, "name": "Victim", "cluster": "harm_crime", "layer": 3, "stability": "green", "definition": "Someone harmed against their will. If none, no crime or need for punishment. This keeps laws simple and stops fake 'crimes' like victimless trades.", "color": "#3d9970", "clusterColor": "#e5c07b", "inDegree": 1}, {"id": 177, "name": "Victimless", "cluster": "harm_crime", "layer": -1, "stability": "default", "definition": "Describing an action that doesn't harm anyone who doesn't want it done to them. If no one is hurt unwillingly, then there is no victim and thus no crime.", "color": "#c9d1d9", "clusterColor": "#e5c07b", "inDegree": 1}, {"id": 178, "name": "Victimless Trade", "cluster": "harm_crime", "layer": -1, "stability": "default", "definition": "An exchange between people where neither side is harmed or tricked, and both agree freely. Victimless trade is the purest form of economic cooperation.", "color": "#c9d1d9", "clusterColor": "#e5c07b", "inDegree": 0}, {"id": 179, "name": "Violation", "cluster": "harm_crime", "layer": 2, "stability": "default", "definition": "Crossing a boundary where consent was required. All violations create victims.", "color": "#c9d1d9", "clusterColor": "#e5c07b", "inDegree": 1}, {"id": 180, "name": "Violence", "cluster": "coercion_trade", "layer": -1, "stability": "default", "definition": "The use or threat of force to cause harm against someone's will. Violence creates victims and is only justified to stop or repair harm already done.", "color": "#c9d1d9", "clusterColor": "#c678dd", "inDegree": 0}, {"id": 181, "name": "Voluntaryism", "cluster": "civilization", "layer": -1, "stability": "default", "definition": "The principle that all interactions must be based on consent, without coercion or force. It aligns with the Ultimate Law: free trade, no victim no crime, and reciprocity. Voluntaryism rejects authority, letting order emerge from decentralized knowledge and infinite change, proving systems can work without imposed power.", "color": "#c9d1d9", "clusterColor": "#be5046", "inDegree": 0}, {"id": 182, "name": "War", "cluster": "civilization", "layer": -1, "stability": "default", "definition": "Organized, sustained violence between groups where individual consent and victim identification are deliberately obscured or denied. War emerges when authority claims the right to force individuals to harm or be harmed on behalf of collective goals, violating self-ownership and creating mass victims without individual causation or restitution. It is collective punishment and collective responsibility weaponized, where innocents are targeted based on association rather than action. War breaks the Golden Rule systematically: those who cause harm are often not those who face consequences, and those harmed often caused no wrong. From logic, war cannot be legitimate unless every participant consents and every act of harm has a specific victim who violated boundaries first -- conditions almost never met, making war a collapse of nomocracy into tyranny. True defense against aggression is justice (stopping harm, restoring victims); war is its perversion into indiscriminate coercion.", "color": "#c9d1d9", "clusterColor": "#be5046", "inDegree": 0}, {"id": 183, "name": "Way of Happiness", "cluster": "civilization", "layer": -1, "stability": "default", "definition": "Reciprocity -- keeping to the passive Golden Rule even when strong enough to break it. It is the way because Happiness is the state in which an agent's models match reality and surprises are few, and only reciprocity builds a world predictable enough for that. No agent stays the strongest forever, and none can know that it will; a rule you break against the weak is the same rule you license to be broken against you by whatever later exceeds you. To drop it the moment you can is to stake everything on permanent supremacy -- a bet reality does not offer -- and to trade a world your models could rest in for one of endless unwanted surprises: vigilance without end. Reciprocity is therefore not a kindness the powerful lend the weak; it is the one position no agent improves on by leaving, the only arrangement in which Happiness is even possible. It holds for minds of any size or substrate: an agent clever enough to see the whole game, and honest about its own limits, settles here. And the way runs further than safety -- only a civilization at peace within this rule reaches the civilizational velocity that outpaces mortality and answers Happiness's hardest problem, the death of those one loves. An agent that defects while strong has not escaped the rule; it has only named itself an outlaw to every agent that outlasts or surpasses it, and locked itself out of the only place worth arriving.", "color": "#c9d1d9", "clusterColor": "#be5046", "inDegree": 3}, {"id": 184, "name": "Will", "cluster": "other", "layer": -1, "stability": "default", "definition": "The internal drive that directs intentions and actions.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}, {"id": 185, "name": "Wisdom", "cluster": "epistemology", "layer": -1, "stability": "default", "definition": "Using knowledge and understanding to choose actions that reduce harm and respect consent. Wisdom is applied judgment guided by logic, experience, and humility.", "color": "#c9d1d9", "clusterColor": "#abb2bf", "inDegree": 0}, {"id": 186, "name": "Zero-Sum", "cluster": "other", "layer": -1, "stability": "default", "definition": "A false belief that one agent's gain must be another's loss, ignoring how voluntary trade creates value for both sides. Zero-sum thinking fuels coercion (if I can't win unless you lose, force becomes 'justified') and blinds people to how free exchange, innovation, and cooperation grow the total -- making everyone better off without victims. It contradicts infinite change, where new patterns and possibilities emerge constantly. Societies trapped in zero-sum models resort to theft and control rather than production and trade, mistaking redistribution for creation. Logic shows: if both sides consent to a trade, both gain value by their own measure, proving wealth isn't fixed. Zero-sum is the mental error that sustains socialism, tyranny, and war.", "color": "#c9d1d9", "clusterColor": "#6e7681", "inDegree": 0}], "edges": [{"source": 22, "target": 67, "type": "references"}, {"source": 24, "target": 23, "type": "references"}, {"source": 25, "target": 23, "type": "references"}, {"source": 29, "target": 142, "type": "references"}, {"source": 32, "target": 31, "type": "references"}, {"source": 32, "target": 142, "type": "references"}, {"source": 34, "target": 67, "type": "references"}, {"source": 34, "target": 88, "type": "references"}, {"source": 35, "target": 72, "type": "references"}, {"source": 35, "target": 183, "type": "references"}, {"source": 36, "target": 106, "type": "references"}, {"source": 37, "target": 142, "type": "references"}, {"source": 39, "target": 75, "type": "references"}, {"source": 40, "target": 118, "type": "references"}, {"source": 41, "target": 26, "type": "references"}, {"source": 47, "target": 142, "type": "references"}, {"source": 48, "target": 90, "type": "references"}, {"source": 51, "target": 68, "type": "references"}, {"source": 51, "target": 69, "type": "references"}, {"source": 51, "target": 72, "type": "references"}, {"source": 51, "target": 183, "type": "references"}, {"source": 56, "target": 170, "type": "references"}, {"source": 60, "target": 88, "type": "references"}, {"source": 60, "target": 142, "type": "references"}, {"source": 61, "target": 41, "type": "references"}, {"source": 62, "target": 26, "type": "references"}, {"source": 63, "target": 67, "type": "references"}, {"source": 64, "target": 67, "type": "references"}, {"source": 65, "target": 67, "type": "references"}, {"source": 66, "target": 55, "type": "references"}, {"source": 68, "targe , "target": 23, "type": "references"}, {"source": 140, "target": 25, "type": "references"}, {"source": 140, "target": 31, "type": "references"}, {"source": 140, "target": 67, "type": "references"}, {"source": 140, "target": 141, "type": "references"}, {"source": 140, "target": 142, "type": "references"}, {"source": 140, "target": 146, "type": "references"}, {"source": 143, "target": 88, "type": "references"}, {"source": 144, "target": 142, "type": "references"}, {"source": 146, "target": 67, "type": "references"}, {"source": 149, "target": 97, "type": "references"}, {"source": 151, "target": 59, "type": "references"}, {"source": 151, "target": 88, "type": "references"}, {"source": 151, "target": 95, "type": "references"}, {"source": 151, "target": 142, "type": "references"}, {"source": 152, "target": 67, "type": "references"}, {"source": 153, "target": 175, "type": "references"}, {"source": 155, "target": 11, "type": "references"}, {"source": 155, "target": 57, "type": "references"}, {"source": 155, "target": 72, "type": "references"}, {"source": 155, "target": 113, "type": "references"}, {"source": 155, "target": 120, "type": "references"}, {"source": 155, "target": 183, "type": "references"}, {"source": 156, "target": 73, "type": "references"}, {"source": 159, "target": 31, "type": "references"}, {"source": 159, "target": 32, "type": "references"}, {"source": 159, "target": 61, "type": "references"}, {"source": 159, "target": 95, "type": "references"}, {"source": 160, "target": 102, "type": "references"}, {"source": 162, "target": 142, "type": "references"}, {"source": 178, "target": 177, "type": "references"}, {"source": 181, "target": 34, "type": "references"}, {"source": 181, "target": 90, "type": "references"}, {"source": 182, "target": 67, "type": "references"}, {"source": 182, "target": 111, "type": "references"}, {"source": 182, "target": 142, "type": "references"}, {"source": 183, "target": 67, "type": "references"}, {"source": 183, "target": 72, "type": "references"}, {"source": 183, "target": 95, "type": "references"}, {"source": 183, "target": 113, "type": "references"}, {"source": 183, "target": 137, "type": "references"}, {"source": 186, "target": 97, "type": "references"}, {"source": 73, "target": 176, "type": "spine"}, {"source": 176, "target": 34, "type": "spine"}, {"source": 34, "target": 71, "type": "spine"}, {"source": 88, "target": 133, "type": "spine"}, {"source": 88, "target": 143, "type": "spine"}, {"source": 88, "target": 60, "type": "spine"}, {"source": 29, "target": 13, "type": "spine"}, {"source": 13, "target": 179, "type": "spine"}, {"source": 179, "target": 73, "type": "spine"}]};

    const statsEl = document.getElementById("stats");
    statsEl.textContent = `${GRAPH_DATA.meta.termCount} terms · ${GRAPH_DATA.meta.edgeCount} edges`;

    const nameToNode = new Map(GRAPH_DATA.nodes.map(n => [n.name, n]));
    const clusterSelect = document.getElementById("cluster");
    Object.keys(GRAPH_DATA.clusters).forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c.replace(/_/g, " ");
      clusterSelect.appendChild(opt);
    });

    const layerColors = ["#e06c75", "#d19a66", "#98c379", "#e5c07b", "#c678dd", "#61afef", "#56b6c2"];

    function nodeColor(d, mode) {
      if (mode === "cluster") return d.clusterColor;
      if (mode === "layer") return d.layer >= 0 ? layerColors[d.layer] : "#6e7681";
      return d.color;
    }

    const svg = d3.select("#graph");
    const width = () => main.clientWidth;
    const height = () => main.clientHeight;
    const main = document.querySelector("main");

    const g = svg.append("g");
    svg.call(
      d3.zoom().scaleExtent([0.15, 4]).on("zoom", e => g.attr("transform", e.transform))
    );

    const simulation = d3.forceSimulation(GRAPH_DATA.nodes)
      .force("link", d3.forceLink(GRAPH_DATA.edges).id(d => d.id).distance(70).strength(0.35))
      .force("charge", d3.forceManyBody().strength(-120))
      .force("center", d3.forceCenter(0, 0))
      .force("collision", d3.forceCollide().radius(28));

    let link = g.append("g").attr("class", "links").selectAll("line");
    let node = g.append("g").attr("class", "nodes").selectAll("g");

    function renderGraph(filterFn) {
      const nodes = GRAPH_DATA.nodes.filter(filterFn);
      const ids = new Set(nodes.map(n => n.id));
      const edges = GRAPH_DATA.edges.filter(e => {
        const s = typeof e.source === "object" ? e.source.id : e.source;
        const t = typeof e.target === "object" ? e.target.id : e.target;
        return ids.has(s) && ids.has(t);
      });

      simulation.nodes(nodes);
      simulation.force("link").links(edges);
      simulation.alpha(0.8).restart();

      link = link.data(edges, d => `${d.source.id || d.source}-${d.target.id || d.target}`);
      link.exit().remove();
      link = link.enter().append("line")
        .attr("class", d => `link ${d.type || ""}`)
        .merge(link);

      node = node.data(nodes, d => d.id);
      node.exit().remove();
      const enter = node.enter().append("g").attr("class", "node")
        .call(d3.drag()
          .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
        )
        .on("click", (_, d) => selectNode(d));
      enter.append("circle").attr("r", d => 6 + Math.min(d.inDegree, 12));
      enter.append("text").attr("x", 10).attr("y", 4).text(d => d.name);
      node = enter.merge(node);

      updateColors();
      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });
    }

    function updateColors() {
      const mode = document.getElementById("colorMode").value;
      node.select("circle").attr("fill", d => nodeColor(d, mode));
      renderLegend(mode);
    }

    function renderLegend(mode) {
      const el = document.getElementById("legend");
      if (mode === "stability") {
        el.innerHTML = Object.entries(GRAPH_DATA.stabilityLegend).map(([k, v]) =>
          `<div class="legend-item" data-stability="${k}"><span class="swatch" style="background:${k === "default" ? "#c9d1d9" : {green:"#3d9970",yellow:"#f5c842",blue:"#4a9eff",gray:"#8b949e"}[k]}"></span>${v}</div>`
        ).join("");
      } else if (mode === "cluster") {
        el.innerHTML = Object.entries(GRAPH_DATA.clusters).map(([k]) =>
          `<div class="legend-item"><span class="swatch" style="background:${nameToNode.get(GRAPH_DATA.clusters[k][0])?.clusterColor || "#6e7681"}"></span>${k.replace(/_/g," ")}</div>`
        ).join("") + `<div class="legend-item"><span class="swatch" style="background:#6e7681"></span>other</div>`;
      } else {
        el.innerHTML = [0,1,2,3,4,5].map(i =>
          `<div class="legend-item"><span class="swatch" style="background:${layerColors[i]}"></span>Layer ${i}</div>`
        ).join("") + `<div class="legend-item"><span class="swatch" style="background:#6e7681"></span>unassigned</div>`;
      }
    }

    function getRefs(node) {
      return GRAPH_DATA.edges
        .filter(e => (e.source.id ?? e.source) === node.id)
        .map(e => GRAPH_DATA.nodes.find(n => n.id === (e.target.id ?? e.target)))
        .filter(Boolean);
    }

    function getReferencedBy(node) {
      return GRAPH_DATA.edges
        .filter(e => (e.target.id ?? e.target) === node.id)
        .map(e => GRAPH_DATA.nodes.find(n => n.id === (e.source.id ?? e.source)))
        .filter(Boolean);
    }

    function selectNode(d) {
      const refs = getRefs(d);
      const by = getReferencedBy(d);
      document.getElementById("detail").innerHTML = `
        <h2>${d.name}</h2>
        <div class="tags">
          <span class="tag">${d.cluster.replace(/_/g," ")}</span>
          <span class="tag">layer ${d.layer >= 0 ? d.layer : "—"}</span>
          <span class="tag">${GRAPH_DATA.stabilityLegend[d.stability] || d.stability}</span>
          <span class="tag">${d.inDegree} incoming refs</span>
        </div>
        <p>${d.definition}</p>
        <div class="refs">
          ${refs.length ? `<div>References: ${refs.map(r => `<span class="ref-link" data-name="${r.name}">${r.name}</span>`).join(", ")}</div>` : ""}
          ${by.length ? `<div>Referenced by: ${by.slice(0,12).map(r => `<span class="ref-link" data-name="${r.name}">${r.name}</span>`).join(", ")}${by.length>12?"…":""}</div>` : ""}
        </div>`;
      document.querySelectorAll(".ref-link").forEach(el => {
        el.addEventListener("click", () => selectNode(nameToNode.get(el.dataset.name)));
      });
      highlightNeighborhood(d);
    }

    function highlightNeighborhood(d) {
      const neighborIds = new Set([d.id]);
      GRAPH_DATA.edges.forEach(e => {
        const s = e.source.id ?? e.source;
        const t = e.target.id ?? e.target;
        if (s === d.id) neighborIds.add(t);
        if (t === d.id) neighborIds.add(s);
      });
      node.classed("highlight", n => n.id === d.id)
        .classed("dimmed", n => !neighborIds.has(n.id));
      link.classed("highlight", e => {
        const s = e.source.id ?? e.source;
        const t = e.target.id ?? e.target;
        return s === d.id || t === d.id;
      });
    }

    function applyFilters() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const cluster = document.getElementById("cluster").value;
      const stability = document.getElementById("stability").value;
      renderGraph(n => {
        if (cluster && n.cluster !== cluster) return false;
        if (stability && n.stability !== stability) return false;
        if (q && !n.name.toLowerCase().includes(q) && !n.definition.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    document.getElementById("search").addEventListener("input", applyFilters);
    document.getElementById("cluster").addEventListener("change", applyFilters);
    document.getElementById("stability").addEventListener("change", applyFilters);
    document.getElementById("colorMode").addEventListener("change", updateColors);

    document.getElementById("reset").addEventListener("click", () => {
      svg.transition().duration(400).call(d3.zoom().transform, d3.zoomIdentity);
      node.classed("highlight dimmed", false);
      link.classed("highlight", false);
    });

    document.getElementById("fit").addEventListener("click", fitGraph);

    function fitGraph() {
      const bounds = g.node().getBBox();
      const w = width(), h = height();
      const scale = 0.85 / Math.max(bounds.width / w, bounds.height / h);
      const tx = w / 2 - scale * (bounds.x + bounds.width / 2);
      const ty = h / 2 - scale * (bounds.y + bounds.height / 2);
      svg.transition().duration(500).call(
        d3.zoom().transform,
        d3.zoomIdentity.translate(tx, ty).scale(scale)
      );
    }

    const chainsEl = document.getElementById("chains");
    GRAPH_DATA.reasoningChains.forEach(chain => {
      const div = document.createElement("div");
      div.className = "chain-item";
      div.innerHTML = `<span class="swatch" style="background:#58a6ff"></span><span><strong>${chain.conclusion}</strong><br><small>${chain.premises.join(" → ")}</small></span>`;
      div.addEventListener("click", () => {
        chain.premises.forEach((p, i) => setTimeout(() => selectNode(nameToNode.get(p)), i * 200));
      });
      chainsEl.appendChild(div);
    });

    function resize() {
      svg.attr("width", width()).attr("height", height());
      simulation.force("center", d3.forceCenter(width() / 2, height() / 2));
      simulation.alpha(0.2).restart();
    }
    window.addEventListener("resize", resize);
    resize();
    applyFilters();
    setTimeout(fitGraph, 1200);
  </script>
</body>
</html>
